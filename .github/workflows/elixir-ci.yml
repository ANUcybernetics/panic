name: Elixir CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up toolchain from mise.toml
        uses: jdx/mise-action@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: deps
          key: ${{ runner.os }}-deps-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Cache compiled build
        uses: actions/cache@v6
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ hashFiles('mise.toml', 'mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compiles without warnings
        run: mix compile --warnings-as-errors --force

      - name: Run tests
        run: mix test
