[tools]
elixir = "1.19.5-otp-28"
erlang = "28.3.1"
node = "latest"
sqlite = "latest"

[env]
AWS_ENDPOINT_URL_S3 = "https://fly.storage.tigris.dev"
AWS_REGION = "auto"

# Secrets are exported from the untracked [env] block in
# ~/.config/mise/config.local.toml. Their 1Password items, kept here because
# the mapping is tedious to reconstruct and lived only in the removed
# fnox.toml:
#   REPLICATE_API_TOKEN     op://Personal/Replicate/credential
#   OPENAI_API_KEY          op://Personal/OpenAI API/credential
#   POSTMARK_API_KEY        op://Personal/Postmark API/credential
#   GOOGLE_AI_STUDIO_TOKEN  op://Personal/Google AI Studio/credential
#   AWS_ACCESS_KEY_ID       op://Personal/AWS S3 panic/username
#   AWS_SECRET_ACCESS_KEY   op://Personal/AWS S3 panic/credential
