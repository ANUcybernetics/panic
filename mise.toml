[tools]
elixir = "1.20.5-otp-29"
erlang = "29.1.2"
node = "26"
sqlite = "3.54.1"

[env]
AWS_ENDPOINT_URL_S3 = "https://fly.storage.tigris.dev"
AWS_REGION = "auto"

# Secrets (REPLICATE_API_TOKEN, OPENAI_API_KEY, GOOGLE_AI_STUDIO_TOKEN,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY) come from the untracked [env]
# block in ~/.config/mise/config.local.toml.

# Use hex.pm's Ubuntu 24.04 Erlang build on every Linux machine: mise doesn't
# detect CI's Ubuntu 26.04 runner, so it would compile there, which --locked rejects
[settings.erlang]
precompiled_os = "ubuntu-24.04"
